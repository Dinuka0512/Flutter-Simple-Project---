name: frist_mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase core (required for all Firebase services)
  firebase_core: ^2.30.0

  # Add Firebase Auth if you want login/register
  firebase_auth: ^4.17.0

  # Add Firestore if you want database
  cloud_firestore: ^4.17.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
